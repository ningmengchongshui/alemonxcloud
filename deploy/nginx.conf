server {
    listen 443 ssl http2;
    server_name tunnel.alemonjs.com;
    client_max_body_size 500m;
    location /connect {
        proxy_pass http://127.0.0.1:13072/connect;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 2m;
        proxy_send_timeout 2m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }
}

# Gateway 命令入口不按来源 IP 限制，避免控制面跨主机、NAT 或出口变化时
# 把正常生命周期任务误拒绝为 403。/command 与 /terminal 仍由 Gateway
# Bearer Token 鉴权；/proxy 仍由控制面传入的实例路由键鉴权。
server {
    listen 443 ssl http2;
    server_name tunnel-internal.alemonjs.com;
    client_max_body_size 500m;

    location = /command {
        proxy_pass http://127.0.0.1:13072/command;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /terminal {
        proxy_pass http://127.0.0.1:13072/terminal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # 仅由控制面带 X-Instance-Route-Key 调用，访问自建实例的公开流量
    # 必须先经控制面完成实例状态与节点校验。
    location = /proxy {
        proxy_pass http://127.0.0.1:13072/proxy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# 保留旧域名但不再把请求转给用户填写的本地目标。
server {
    listen 443 ssl http2;
    server_name "~^control-(?<route>r[0-9a-f]{16})\.alemonjs\.com$";
    return 410;
}

server {
    listen 443 ssl http2;
    server_name xcloud.alemonjs.com;
    client_max_body_size 500m;
    location / {
        proxy_pass http://127.0.0.1:13082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }
}
server {
    listen 443 ssl http2;
    server_name "~^xcloud-(?<route>r[0-9a-f]{16})\.alemonjs\.com$";
    client_max_body_size 3g;
    location / {
        rewrite ^ /__instance_proxy break;
        proxy_pass http://127.0.0.1:13082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Route-Key $route;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }
}
