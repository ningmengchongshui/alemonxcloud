# Include this server block in the public Nginx configuration. It passes only
# route identifiers to the control plane. It resolves the target node and then
# reaches that node's private Agent; no user container exposes a host port.
server {
    listen 443 ssl http2;
    server_name ~^xcloud-(?<route>r[0-9a-f]{16})\.alemonjs\.com$;

    location / {
        proxy_pass http://127.0.0.1:13082/__instance_proxy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Route-Key $route;
        proxy_set_header X-Forwarded-Uri $request_uri;
    }
}
