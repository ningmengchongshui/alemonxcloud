# Include this server block in the public Nginx configuration. It passes only
# route identifiers to the private agent; the agent resolves the random Docker
# container name itself and no user container exposes a host port.
server {
    listen 443 ssl http2;
    server_name ~^xcloud-(?<route>r[0-9a-f]{16})\.alemonjs\.com$;

    location / {
        proxy_pass http://127.0.0.1:9092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Route-Key $route;
    }
}
