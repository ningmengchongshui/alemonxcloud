groups:
  - name: xcloud
    rules:
      - alert: XCloudNotReady
        expr: up{job="xcloud"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "ALemonX Cloud is not ready" }
      - alert: XCloudTaskBacklog
        expr: xcloud_tasks_backlog > 0
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "ALemonX Cloud task backlog exceeds 10 minutes" }
      - alert: XCloudFailedTasks
        expr: xcloud_tasks_failed > 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "ALemonX Cloud has failed tasks" }
      - alert: XCloudAgentHeartbeatStale
        expr: time() - xcloud_node_heartbeat_timestamp > 90
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "ALemonX Cloud Agent heartbeat is stale" }
      - alert: XCloudDeploymentFailed
        expr: xcloud_instances_deployment_failed > 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "ALemonX Cloud has instances awaiting deployment recovery" }
      - alert: XCloudRuntimeMissing
        expr: xcloud_instances_runtime_missing > 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "ALemonX Cloud Agent reports missing instance containers" }
      - alert: XCloudDestroyBlocked
        expr: xcloud_instances_destroy_blocked > 0
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "ALemonX Cloud destruction is blocked past its scheduled time" }
      - alert: XCloudOfflineLifecycleInstances
        expr: xcloud_nodes_offline_instances > 0
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "ALemonX Cloud offline nodes have lifecycle work pending" }
      - alert: XCloudLeaseRecoveryRepeated
        expr: xcloud_tasks_lease_recovered_24h >= 3
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "ALemonX Cloud repeatedly recovers expired task leases" }
      - alert: XCloudPlanChangeFundsPending
        expr: xcloud_plan_changes_fund_pending > 0
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "ALemonX Cloud has套餐变更资金待结算超过10分钟" }
      - alert: XCloudPlanChangeNeedsReview
        expr: xcloud_plan_changes_needs_review > 0
        for: 30m
        labels: { severity: critical }
        annotations: { summary: "ALemonX Cloud has套餐变更待人工核实超过30分钟" }
      - alert: XCloudPlanChangeAgentVerifyFailures
        expr: xcloud_plan_changes_agent_verify_failures > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "ALemonX Cloud Agent资源核实出现失败" }
      - alert: XCloudPlanChangeProcessingStale
        expr: xcloud_plan_changes_processing > 0
        for: 15m
        labels: { severity: warning }
        annotations: { summary: "ALemonX Cloud套餐变更持续处理中" }
