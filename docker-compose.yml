services:
  alemonxcloud:
    build:
      context: .
      secrets:
        - source: github_token
          target: github_token
    image: alemonxcloud:latest
    env_file: .env
    ports:
      - "13082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - xcloud_control

networks:
  # Fixed subnet lets the host firewall admit only the control-plane container
  # to the systemd agent port.
  xcloud_control:
    name: xcloud_control
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

secrets:
  github_token:
    environment: GITHUB_TOKEN
